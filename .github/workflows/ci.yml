name: Backend CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: parkly_test
          POSTGRES_USER: parkly_test
          POSTGRES_PASSWORD: parkly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parkly_test -d parkly_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://parkly_test:parkly_test@localhost:5432/parkly_test?schema=public
      JWT_SECRET: ci-only-access-secret-with-at-least-32-characters
      JWT_REFRESH_SECRET: ci-only-refresh-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm prisma:deploy
      - run: pnpm prisma:seed
      - run: pnpm test:cov
      - run: pnpm build
      - name: Save test coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7
      - name: SonarCloud branch notice
        if: github.event_name == 'pull_request' || github.ref_name != github.event.repository.default_branch
        run: echo 'SonarCloud and Quality Gate run only on the default branch, as required by the current SonarCloud organization plan. Tests and build still run here.' >> "$GITHUB_STEP_SUMMARY"
  sonarcloud:
    name: SonarCloud and Quality Gate
    needs: verify
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage
      - name: Check SonarCloud configuration and coverage
        shell: bash
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo '::error::Create the SONAR_TOKEN repository secret before enabling SonarCloud.'
            exit 1
          fi
          test -s coverage/lcov.info
      - name: Analyze and wait for Quality Gate
        uses: SonarSource/sonarqube-scan-action@v8.0.0
